<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart — The Backdrop Bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #fdf8f3; --parchment: #f5ede1; --blush: #e8cfc2; --rose: #d4a89a;
      --warm-tan: #c9b49a; --text-dark: #3a2e28; --text-mid: #7a6a60; --text-soft: #a99589;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--cream); color: var(--text-dark); font-family: 'Jost', sans-serif; font-weight: 300; min-height: 100vh; }

    /* ── NAV ── */
    .top-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 40px;
      background: var(--cream);
      border-bottom: 1px solid rgba(201,180,154,0.25);
      position: sticky; top: 0; z-index: 100;
    }
    .top-nav-logo {
      font-family: 'Great Vibes', cursive;
      font-size: 1.6rem; color: var(--text-dark); text-decoration: none;
    }
    .top-nav-back {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--text-soft); text-decoration: none; transition: color 0.2s;
    }
    .top-nav-back:hover { color: var(--text-dark); }
    .top-nav-back svg { width: 14px; height: 14px; }

    /* ── PAGE LAYOUT ── */
    .cart-page {
      max-width: 960px; margin: 0 auto;
      padding: 48px 24px 80px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 40px;
      align-items: start;
    }

    /* ── PAGE TITLE ── */
    .cart-title-wrap { grid-column: 1 / -1; margin-bottom: 8px; }
    .cart-eyebrow {
      font-size: 0.62rem; letter-spacing: 0.28em;
      text-transform: uppercase; color: var(--text-soft); margin-bottom: 8px;
    }
    .cart-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem; font-weight: 300; color: var(--text-dark);
    }
    .cart-divider {
      height: 1px; background: rgba(201,180,154,0.25); margin-top: 16px;
    }

    /* ── EMPTY STATE ── */
    .cart-empty {
      grid-column: 1 / -1;
      text-align: center; padding: 80px 24px;
      color: var(--text-soft);
    }
    .cart-empty svg { width: 48px; height: 48px; stroke: var(--blush); margin-bottom: 20px; }
    .cart-empty h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem; font-weight: 300; color: var(--text-mid); margin-bottom: 10px;
    }
    .cart-empty p { font-size: 0.75rem; letter-spacing: 0.1em; margin-bottom: 28px; }
    .cart-empty a {
      display: inline-block; padding: 13px 32px;
      background: var(--text-dark); color: white;
      border-radius: 8px; text-decoration: none;
      font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
      transition: background 0.25s;
    }
    .cart-empty a:hover { background: var(--text-mid); }

    /* ── CART ITEMS ── */
    .cart-items { display: flex; flex-direction: column; gap: 16px; }

    .cart-item {
      display: grid;
      grid-template-columns: 100px 1fr auto;
      grid-template-rows: auto auto;
      column-gap: 18px;
      row-gap: 0;
      align-items: start;
      background: white;
      border: 1px solid rgba(201,180,154,0.25);
      border-radius: 14px;
      padding: 20px;
    }

    .cart-item-img {
      grid-column: 1;
      grid-row: 1 / 3;
      width: 100px; height: 130px;
      border-radius: 8px; overflow: hidden;
      background: var(--parchment); flex-shrink: 0;
    }

    /* Footer row: duration (left) + remove (right), spans cols 2-3 */
    .cart-item-footer {
      grid-column: 2 / 4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      margin-top: 6px;
      border-top: 1px solid rgba(201,180,154,0.1);
    }

    .edit-dates-btn {
      background: none; border: none; cursor: pointer;
      font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--warm-tan); padding: 4px 0; margin-top: 5px;
      display: inline-block; text-decoration: underline;
      text-underline-offset: 2px; transition: color 0.2s;
    }
    .edit-dates-btn:hover { color: var(--text-dark); }
    .cart-item-img svg { width: 100%; height: 100%; display: block; }

    .cart-item-details { display: flex; flex-direction: column; gap: 8px; }

    /* Remove button — now lives in footer row */
    .cart-remove {
      font-size: 0.58rem; letter-spacing: 0.1em;
      color: var(--text-soft);
      background: none; border: none; cursor: pointer;
      transition: color 0.2s; padding: 4px 0;
    }
    .cart-remove:hover { color: #b05a5a; }

    .cart-item-duration {
      font-size: 0.68rem; letter-spacing: 0.1em;
      color: var(--text-soft);
    }

    .cart-item-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem; font-weight: 400; color: var(--text-dark);
    }
    .cart-item-variant {
      font-size: 0.72rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--text-soft);
    }
    .cart-item-dates {
      display: flex; flex-direction: column; gap: 5px;
      margin-top: 4px;
    }
    .cart-item-date-row {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.76rem; color: var(--text-mid);
    }
    .cart-item-date-row svg { width: 13px; height: 13px; stroke: var(--warm-tan); flex-shrink: 0; }
    .cart-item-price {
      font-size: 1.05rem; font-weight: 300;
      color: var(--text-dark); margin-top: 2px;
    }

    .cart-item-right {
      display: flex; flex-direction: column;
      align-items: flex-end; gap: 12px;
    }

    /* Qty control */
    .cart-qty {
      display: flex; align-items: center; gap: 0;
      border: 1px solid rgba(201,180,154,0.45);
      border-radius: 8px; overflow: hidden;
    }
    .cart-qty-btn {
      width: 32px; height: 32px;
      background: none; border: none;
      font-size: 1rem; color: var(--text-mid);
      cursor: pointer; transition: background 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .cart-qty-btn:hover { background: rgba(201,180,154,0.12); }
    .cart-qty-num {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; color: var(--text-dark);
      border-left: 1px solid rgba(201,180,154,0.35);
      border-right: 1px solid rgba(201,180,154,0.35);
    }

    .cart-item-subtotal {
      font-size: 0.9rem; font-weight: 300; color: var(--text-dark);
      text-align: right;
    }
    .cart-item-subtotal span {
      display: block; font-size: 0.58rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-soft); margin-bottom: 2px;
    }

    /* ── ORDER SUMMARY ── */
    .order-summary {
      background: white;
      border: 1px solid rgba(201,180,154,0.25);
      border-radius: 14px;
      padding: 24px;
      position: sticky; top: 80px;
    }
    .summary-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem; font-weight: 300;
      color: var(--text-dark); margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(201,180,154,0.2);
    }
    .summary-row {
      display: flex; justify-content: space-between;
      font-size: 0.72rem; letter-spacing: 0.08em;
      color: var(--text-mid); padding: 7px 0;
    }
    .summary-row.total {
      border-top: 1px solid rgba(201,180,154,0.25);
      margin-top: 10px; padding-top: 14px;
      font-size: 0.85rem; color: var(--text-dark);
      font-weight: 300;
    }
    .summary-row.total strong { font-weight: 400; }

    .checkout-btn {
      width: 100%; margin-top: 20px;
      padding: 16px;
      background: var(--text-dark); color: white;
      border: none; border-radius: 10px;
      font-family: 'Jost', sans-serif;
      font-size: 0.72rem; font-weight: 300;
      letter-spacing: 0.22em; text-transform: uppercase;
      cursor: pointer; text-decoration: none;
      display: block; text-align: center;
      transition: background 0.25s;
    }
    .checkout-btn:hover { background: var(--text-mid); }

    .continue-btn {
      width: 100%; margin-top: 10px;
      padding: 13px;
      background: var(--cream); color: var(--text-dark);
      border: 1px solid rgba(201,180,154,0.5);
      border-radius: 10px;
      font-family: 'Jost', sans-serif;
      font-size: 0.7rem; font-weight: 300;
      letter-spacing: 0.18em; text-transform: uppercase;
      cursor: pointer; text-decoration: none;
      display: block; text-align: center;
      transition: all 0.25s;
    }
    .continue-btn:hover { background: var(--parchment); border-color: var(--warm-tan); }

    .summary-note {
      margin-top: 14px;
      font-size: 0.6rem; letter-spacing: 0.08em;
      color: var(--text-soft); line-height: 1.8; text-align: center;
    }

    .damage-note {
      margin-top: 12px; font-size: 0.6rem; letter-spacing: 0.08em;
      color: var(--text-soft); line-height: 1.7;
      padding: 10px 12px;
      background: rgba(245,238,230,0.5);
      border-radius: 6px;
    }

    /* ── EDIT DATES MODAL ── */
    .edit-modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 600;
      background: rgba(58,46,40,0.45);
      align-items: center; justify-content: center;
    }
    .edit-modal-overlay.open { display: flex; }
    .edit-modal-box {
      background: white; border-radius: 16px; padding: 28px;
      width: 360px; max-width: 92vw;
      box-shadow: 0 12px 48px rgba(58,46,40,0.15);
    }
    .edit-modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }
    .edit-modal-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem; font-weight: 300; color: var(--text-dark);
    }
    .edit-modal-close {
      background: none; border: none; cursor: pointer;
      font-size: 1.1rem; color: var(--text-soft);
    }
    .edit-date-label {
      font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--text-soft); margin-bottom: 6px;
    }
    .edit-date-field {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 13px;
      border: 1px solid rgba(201,180,154,0.45); border-radius: 8px;
      cursor: pointer; background: white; transition: border-color 0.2s;
      margin-bottom: 14px;
    }
    .edit-date-field:hover { border-color: var(--warm-tan); }
    .edit-date-field.filled { border-color: var(--warm-tan); }
    .edit-date-field span { font-size: 0.72rem; color: var(--text-mid); }
    .edit-date-field.filled span { color: var(--text-dark); }
    .edit-save-btn {
      width: 100%; padding: 13px; background: var(--text-dark); color: white;
      border: none; border-radius: 10px; font-family: 'Jost', sans-serif;
      font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
      cursor: pointer; margin-top: 4px; transition: background 0.25s;
    }
    .edit-save-btn:hover { background: var(--text-mid); }

    /* ── CALENDAR PICKER (shared) ── */
    .picker-overlay {
      display: none; position: fixed; inset: 0; z-index: 700;
      background: rgba(58,46,40,0.35);
      align-items: center; justify-content: center;
    }
    .picker-overlay.open { display: flex; }
    .picker-popup {
      background: white; border-radius: 16px; padding: 24px;
      width: 300px; max-width: 92vw;
      box-shadow: 0 12px 48px rgba(58,46,40,0.15);
    }
    .picker-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .picker-title-lbl { font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-soft); }
    .picker-close-btn { background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--text-soft); }
    .cal-nav-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .cal-nav-btn { background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--text-mid); padding: 4px 10px; }
    .cal-month-lbl { font-family: 'Cormorant Garamond', serif; font-size: 1rem; font-weight: 300; color: var(--text-dark); }
    .cal-days-header { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; margin-bottom: 6px; }
    .cal-day-lbl { text-align: center; font-size: 0.58rem; letter-spacing: 0.1em; color: var(--text-soft); padding: 3px 0; }
    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; margin-bottom: 16px; }
    .cal-day { text-align: center; padding: 7px 2px; font-size: 0.75rem; border-radius: 6px; cursor: pointer; color: var(--text-mid); transition: background 0.15s; }
    .cal-day:hover:not(.disabled):not(.empty) { background: rgba(201,180,154,0.2); }
    .cal-day.selected { background: var(--text-dark); color: white; }
    .cal-day.today { color: var(--text-dark); font-weight: 400; }
    .cal-day.disabled { color: rgba(201,180,154,0.4); cursor: default; }
    .cal-day.empty { cursor: default; }
    .picker-confirm-btn {
      width: 100%; padding: 13px; background: var(--text-dark); color: white;
      border: none; border-radius: 10px; font-family: 'Jost', sans-serif;
      font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .cart-page { grid-template-columns: 1fr; padding: 28px 16px 60px; gap: 28px; }
      .order-summary { position: static; }
      .top-nav { padding: 14px 20px; }
      .cart-item { grid-template-columns: 72px 1fr auto; column-gap: 12px; padding: 14px; }
      .cart-item-img { width: 72px; height: 88px; }
    }
  </style>
</head>
<body>

<!-- ── NAV ── -->
<nav class="top-nav">
  <a href="index.html" class="top-nav-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    Back
  </a>
  <a href="index.html" class="top-nav-logo">the backdrop bar</a>
  <div style="width:60px;"></div>
</nav>

<!-- ── EDIT DATES MODAL ── -->
<div class="edit-modal-overlay" id="editModalOverlay">
  <div class="edit-modal-box">
    <div class="edit-modal-header">
      <div class="edit-modal-title">Edit Rental Dates</div>
      <button class="edit-modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <div class="edit-date-label">Needed By</div>
    <div class="edit-date-field" id="editPickupField" onclick="openEditPicker('pickup')">
      <span id="editPickupDisplay">Select date &amp; time</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a99589" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </div>
    <div class="edit-date-label">Return By</div>
    <div class="edit-date-field" id="editReturnField" onclick="openEditPicker('return')">
      <span id="editReturnDisplay">Select date &amp; time</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a99589" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </div>
    <div id="editDurationNote" style="font-size:0.65rem;color:var(--text-soft);min-height:18px;margin-bottom:14px;"></div>
    <button class="edit-save-btn" onclick="saveEditDates()">Update Dates</button>
  </div>
</div>

<!-- ── CALENDAR PICKER POPUP ── -->
<div class="picker-overlay" id="cartPickerOverlay">
  <div class="picker-popup">
    <div class="picker-header">
      <span class="picker-title-lbl" id="cartPickerTitle"></span>
      <button class="picker-close-btn" onclick="closeCartPicker()">✕</button>
    </div>
    <div class="cal-nav-row">
      <button class="cal-nav-btn" onclick="changeCartMonth(-1)">‹</button>
      <div class="cal-month-lbl" id="cartCalMonthLabel"></div>
      <button class="cal-nav-btn" onclick="changeCartMonth(1)">›</button>
    </div>
    <div class="cal-days-header">
      <div class="cal-day-lbl">Su</div><div class="cal-day-lbl">Mo</div>
      <div class="cal-day-lbl">Tu</div><div class="cal-day-lbl">We</div>
      <div class="cal-day-lbl">Th</div><div class="cal-day-lbl">Fr</div>
      <div class="cal-day-lbl">Sa</div>
    </div>
    <div class="cal-grid" id="cartCalGrid"></div>
    <div style="border-top:1px solid rgba(201,180,154,0.2);padding-top:14px;margin-bottom:14px;">
      <div style="font-size:0.6rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-soft);margin-bottom:10px;">Time</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <select id="cartPickerHour" style="flex:1;padding:8px 10px;border:1px solid rgba(201,180,154,0.5);border-radius:8px;font-family:'Jost',sans-serif;font-size:0.78rem;color:var(--text-dark);background:white;"></select>
        <span style="color:var(--text-soft);">:</span>
        <select id="cartPickerMin" style="flex:1;padding:8px 10px;border:1px solid rgba(201,180,154,0.5);border-radius:8px;font-family:'Jost',sans-serif;font-size:0.78rem;color:var(--text-dark);background:white;">
          <option value="00">00</option><option value="15">15</option>
          <option value="30">30</option><option value="45">45</option>
        </select>
      </div>
    </div>
    <button class="picker-confirm-btn" onclick="confirmCartPicker()">Confirm</button>
  </div>
</div>

<!-- ── CART PAGE ── -->
<div class="cart-page" id="cartPage">

  <div class="cart-title-wrap">
    <div class="cart-eyebrow">Your Selection</div>
    <h1 class="cart-title">Cart</h1>
    <div class="cart-divider"></div>
  </div>

  <!-- Items column -->
  <div class="cart-items" id="cartItems"></div>

  <!-- Summary column -->
  <div class="order-summary" id="orderSummary">
    <div class="summary-title">Order Summary</div>
    <div id="summaryRows"></div>
    <div class="summary-row total">
      <strong>Subtotal</strong>
      <strong id="summaryTotal">$0.00</strong>
    </div>
    <a href="checkout.html" class="checkout-btn">Proceed to Checkout</a>
    <a href="index.html" class="continue-btn">Continue Shopping</a>
    <p class="summary-note">Full payment charged at checkout · CA sales tax applied</p>
  </div>

</div>

<script>
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const now = new Date();

  // ── Date Edit State
  let editItemIdx = null;
  let activePicker = null;
  let calYear = now.getFullYear(), calMonth = now.getMonth(), selectedDay = null;
  let editPickupDate = null, editReturnDate = null;

  function loadCart() { return JSON.parse(localStorage.getItem('tbb_cart') || '[]'); }
  function saveCart(cart) { localStorage.setItem('tbb_cart', JSON.stringify(cart)); }

  function parsePickupTime(display) {
    const match = display.match(/(\w+ \d+, \d+) at (\d+):(\d+) (AM|PM)/);
    if (!match) return null;
    const [, dateStr, hours, mins, ampm] = match;
    let h = parseInt(hours);
    if (ampm === 'PM' && h !== 12) h += 12;
    if (ampm === 'AM' && h === 12) h = 0;
    const d = new Date(dateStr);
    d.setHours(h, parseInt(mins), 0, 0);
    return isNaN(d.getTime()) ? null : d;
  }

  function render() {
    const cart    = loadCart();
    const itemsEl = document.getElementById('cartItems');
    const rowsEl  = document.getElementById('summaryRows');
    const totalEl = document.getElementById('summaryTotal');
    const pageEl  = document.getElementById('cartPage');

    itemsEl.innerHTML = '';
    rowsEl.innerHTML  = '';

    if (cart.length === 0) {
      pageEl.innerHTML = `
        <div class="cart-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 01-8 0"/>
          </svg>
          <h2>Your cart is empty</h2>
          <p>Looks like you haven't added anything yet.</p>
          <a href="index.html">Browse Collection</a>
        </div>`;
      return;
    }

    let subtotal = 0;

    cart.forEach((item, idx) => {
      const daysMatch = item.duration ? item.duration.match(/(\d+)\s*day/) : null;
      const days = daysMatch ? parseInt(daysMatch[1]) : 1;
      subtotal += item.price * item.qty * days;
      const div = document.createElement('div');
      div.className = 'cart-item';
      div.innerHTML = `
        <div class="cart-item-img">${item.imgHTML}</div>
        <div class="cart-item-details">
          <div class="cart-item-name">${item.title}</div>
          <div class="cart-item-variant">${item.variant}</div>
          <div class="cart-item-dates">
            <div class="cart-item-date-row">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span>Needed: ${item.pickup !== 'Select date & time' ? item.pickup : '—'}</span>
            </div>
            <div class="cart-item-date-row">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span>Return: ${item.ret !== 'Select date & time' ? item.ret : '—'}</span>
            </div>
            <button class="edit-dates-btn" onclick="openEditModal(${idx})">Edit Dates</button>
          </div>
          <div class="cart-item-price">$${item.price} <span style="font-size:0.62rem;color:var(--text-soft);">/ day</span></div>
        </div>
        <div class="cart-item-right">
          <div class="cart-qty">
            <button class="cart-qty-btn" onclick="changeQty(${idx}, -1)">−</button>
            <div class="cart-qty-num">${item.qty}</div>
            <button class="cart-qty-btn" onclick="changeQty(${idx}, 1)">+</button>
          </div>
          <div class="cart-item-subtotal">
            <span>Subtotal</span>
            $${(item.price * item.qty * days).toFixed(2)}
          </div>
        </div>
        <div class="cart-item-footer">
          <div class="cart-item-duration">${item.duration || ''}</div>
          <button class="cart-remove" onclick="removeItem(${idx})">Remove</button>
        </div>`;
      itemsEl.appendChild(div);

      const row = document.createElement('div');
      row.className = 'summary-row';
      row.innerHTML = `<span>${item.title} × ${item.qty} (${days}d)</span><span>$${(item.price * item.qty * days).toFixed(2)}</span>`;
      rowsEl.appendChild(row);
    });

    // Simple cart summary — just subtotal, no delivery/tax yet
    const divider = document.createElement('div');
    divider.style = 'height:1px;background:rgba(201,180,154,0.2);margin:8px 0;';
    rowsEl.appendChild(divider);

    const subtotalRow = document.createElement('div');
    subtotalRow.className = 'summary-row total';
    subtotalRow.innerHTML = `<strong>Subtotal</strong><strong>$${subtotal.toFixed(2)}</strong>`;
    rowsEl.appendChild(subtotalRow);

    const note = document.createElement('div');
    note.style = 'font-size:0.6rem;color:#a99589;margin-top:8px;line-height:1.6;';
    note.textContent = 'Delivery fee and CA sales tax will be calculated at checkout.';
    rowsEl.appendChild(note);

    totalEl.textContent = '$' + subtotal.toFixed(2);
  }

  function changeQty(idx, delta) {
    const cart = loadCart();
    cart[idx].qty = Math.min(5, Math.max(1, cart[idx].qty + delta));
    saveCart(cart); render();
  }

  function removeItem(idx) {
    const cart = loadCart();
    cart.splice(idx, 1);
    saveCart(cart); render();
  }

  // ── Hour picker
  const CART_TIME_SLOTS = [
    {v:'07',a:'AM'},{v:'08',a:'AM'},{v:'09',a:'AM'},{v:'10',a:'AM'},{v:'11',a:'AM'},
    {v:'12',a:'PM'},{v:'01',a:'PM'},{v:'02',a:'PM'},{v:'03',a:'PM'},{v:'04',a:'PM'},
    {v:'05',a:'PM'},{v:'06',a:'PM'},{v:'07',a:'PM'},{v:'08',a:'PM'},{v:'09',a:'PM'}
  ];
  function cartSlotTo24(s) {
    var h = parseInt(s.v);
    if (s.a === 'PM' && h !== 12) h += 12;
    if (s.a === 'AM' && h === 12) h = 0;
    return h;
  }
  function rebuildCartHours(isToday) {
    var el = document.getElementById('cartPickerHour');
    if (!el) return;
    var n = new Date();
    var curH = n.getHours(), curM = n.getMinutes();
    var LAST_BOOKING_HOUR = 20; // 8 PM — after 8:15 PM no same-day slots
    var pastCutoff = isToday && (curH > LAST_BOOKING_HOUR || (curH === LAST_BOOKING_HOUR && curM > 15));
    var minHour = isToday ? curH + 1 : 0;
    el.innerHTML = '';
    if (!pastCutoff) {
      CART_TIME_SLOTS.forEach(function(s) {
        if (cartSlotTo24(s) < minHour) return;
        var o = document.createElement('option');
        o.value = s.v + '|' + s.a;
        o.textContent = parseInt(s.v) + ' ' + s.a;
        el.appendChild(o);
      });
    }
    if (el.options.length === 0) {
      var o = document.createElement('option');
      o.value = '';
      o.textContent = 'No available times today — please select a future date';
      el.appendChild(o);
    }
  }
  document.addEventListener('DOMContentLoaded', function() {
    rebuildCartHours(false);
  });

  // ── Edit Dates Modal
  function openEditModal(idx) {
    editItemIdx = idx;
    const cart = loadCart();
    const item = cart[idx];
    const hasPickup = item.pickup && item.pickup !== 'Select date & time';
    const hasReturn = item.ret && item.ret !== 'Select date & time';

    document.getElementById('editPickupDisplay').textContent = hasPickup ? item.pickup : 'Select date & time';
    document.getElementById('editReturnDisplay').textContent = hasReturn ? item.ret : 'Select date & time';
    document.getElementById('editPickupField').classList.toggle('filled', hasPickup);
    document.getElementById('editReturnField').classList.toggle('filled', hasReturn);
    document.getElementById('editDurationNote').textContent = item.duration || '';
    document.getElementById('editDurationNote').style.color = 'var(--text-soft)';

    editPickupDate = null;
    editReturnDate = null;
    document.getElementById('editModalOverlay').classList.add('open');
  }

  function closeEditModal() {
    document.getElementById('editModalOverlay').classList.remove('open');
    editItemIdx = null;
  }

  function openEditPicker(type) {
    activePicker = type;
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    selectedDay = null;
    document.getElementById('cartPickerTitle').textContent = type === 'pickup' ? 'Needed By' : 'Return By';
    document.getElementById('cartPickerOverlay').classList.add('open');
    rebuildCartHours(true); // opens on current month — filter past times by default
    renderCartCalendar();
  }

  function closeCartPicker() {
    document.getElementById('cartPickerOverlay').classList.remove('open');
    activePicker = null;
  }

  function changeCartMonth(delta) {
    calMonth += delta;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    if (calMonth < 0)  { calMonth = 11; calYear--; }
    const isCurrentMonth = calYear === now.getFullYear() && calMonth === now.getMonth();
    rebuildCartHours(isCurrentMonth);
    selectedDay = null;
    renderCartCalendar();
  }

  function renderCartCalendar() {
    document.getElementById('cartCalMonthLabel').textContent = `${MONTHS[calMonth]} ${calYear}`;
    const grid = document.getElementById('cartCalGrid');
    grid.innerHTML = '';
    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const td = now.getDate(), tm = now.getMonth(), ty = now.getFullYear();

    for (let i = 0; i < firstDay; i++) {
      const e = document.createElement('div'); e.className = 'cal-day empty'; grid.appendChild(e);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const cell = document.createElement('div');
      cell.className = 'cal-day';
      cell.textContent = d;
      const isPast = (calYear < ty) || (calYear === ty && calMonth < tm) || (calYear === ty && calMonth === tm && d < td);
      if (activePicker === 'return' && editPickupDate) {
        const pd = new Date(editPickupDate.y, editPickupDate.m, editPickupDate.d);
        if (new Date(calYear, calMonth, d) < pd) { cell.classList.add('disabled'); grid.appendChild(cell); continue; }
      }
      if (isPast) {
        cell.classList.add('disabled');
      } else {
        if (calYear === ty && calMonth === tm && d === td) cell.classList.add('today');
        if (selectedDay && selectedDay.d === d && selectedDay.m === calMonth && selectedDay.y === calYear) cell.classList.add('selected');
        cell.onclick = () => {
          selectedDay = { d, m: calMonth, y: calYear };
          const isToday = calYear === now.getFullYear() && calMonth === now.getMonth() && d === now.getDate();
          rebuildCartHours(isToday);
          renderCartCalendar();
        };
      }
      grid.appendChild(cell);
    }
  }

  function confirmCartPicker() {
    if (!selectedDay) { alert('Please select a date.'); return; }
    const hourVal = document.getElementById('cartPickerHour').value;
    const [h, ampm] = hourVal.split('|');
    const min = document.getElementById('cartPickerMin').value;
    const dateStr = `${MONTHS[selectedDay.m]} ${selectedDay.d}, ${selectedDay.y}`;
    const timeStr = `${parseInt(h)}:${min} ${ampm}`;
    const display = `${dateStr} at ${timeStr}`;
    const noteEl = document.getElementById('editDurationNote');

    let hour24 = parseInt(h);
    if (ampm === 'PM' && hour24 !== 12) hour24 += 12;
    if (ampm === 'AM' && hour24 === 12) hour24 = 0;
    const selectedMs = new Date(selectedDay.y, selectedDay.m, selectedDay.d, hour24, parseInt(min)).getTime();

    // Block past times if today is selected
    if (selectedMs <= Date.now()) {
      noteEl.textContent = 'That time has already passed — please select a future time.';
      noteEl.style.color = '#c9705a';
      closeCartPicker();
      return;
    }

    if (activePicker === 'return' && editPickupDate) {
      let ph = editPickupDate.h;
      if (editPickupDate.ampm === 'PM' && ph !== 12) ph += 12;
      if (editPickupDate.ampm === 'AM' && ph === 12) ph = 0;
      const pickupMs = new Date(editPickupDate.y, editPickupDate.m, editPickupDate.d, ph, editPickupDate.min).getTime();
      if (selectedMs < pickupMs + 15 * 60 * 1000) {
        noteEl.textContent = 'Return must be at least 15 minutes after pickup.';
        noteEl.style.color = '#c9705a';
        closeCartPicker();
        return;
      }
    }

    if (activePicker === 'pickup') {
      editPickupDate = { ...selectedDay, h: parseInt(h), min: parseInt(min), ampm };
      document.getElementById('editPickupDisplay').textContent = display;
      document.getElementById('editPickupField').classList.add('filled');
      if (editReturnDate) {
        editReturnDate = null;
        document.getElementById('editReturnDisplay').textContent = 'Select date & time';
        document.getElementById('editReturnField').classList.remove('filled');
        noteEl.textContent = '';
      }
    } else {
      editReturnDate = { ...selectedDay };
      document.getElementById('editReturnDisplay').textContent = display;
      document.getElementById('editReturnField').classList.add('filled');
      if (editPickupDate) {
        const d1 = new Date(editPickupDate.y, editPickupDate.m, editPickupDate.d);
        const d2 = new Date(selectedDay.y, selectedDay.m, selectedDay.d);
        const diff = Math.round((d2 - d1) / 86400000);
        noteEl.textContent = diff === 0 ? 'Same-day rental' : `Rental duration: ${diff} day${diff !== 1 ? 's' : ''}`;
        noteEl.style.color = 'var(--text-soft)';
      }
    }
    closeCartPicker();
  }

  function saveEditDates() {
    const noteEl = document.getElementById('editDurationNote');
    const pickup = document.getElementById('editPickupDisplay').textContent;
    const ret = document.getElementById('editReturnDisplay').textContent;
    if (pickup === 'Select date & time') {
      noteEl.textContent = 'Please select a pickup date.';
      noteEl.style.color = '#c9705a';
      return;
    }
    if (ret === 'Select date & time') {
      noteEl.textContent = 'Please select a return date.';
      noteEl.style.color = '#c9705a';
      return;
    }
    const cart = loadCart();
    cart[editItemIdx].pickup = pickup;
    cart[editItemIdx].ret = ret;
    cart[editItemIdx].duration = noteEl.textContent;
    saveCart(cart);
    closeEditModal();
    render();
  }

  // Close modals on overlay click
  document.getElementById('editModalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeEditModal();
  });
  document.getElementById('cartPickerOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeCartPicker();
  });

  render();
</script>

</body>
</html>
